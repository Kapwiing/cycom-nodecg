<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Teams Overlay</title>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
		<style>
			@font-face {
				font-family: "Horizon-Bold";
				src: url("shared/horizon.otf") format("opentype");
				font-weight: bold;
				font-style: normal;
			}

			body, html {
				font-family: "Horizon-Bold";
                height: 100%;
                margin: 0;
                position: relative;
				overflow: hidden; /* Hide scrollbars */
            }

            #teamsOverlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 2;
            }

            #team1, #team2 {
				position: absolute;
				z-index: 2;
				width: 100%;
				top: 0.3%;
				text-align: center;
            }
            #team1 {
				right: 18%;
            }
            #team2 {
				left: 18%;
            }

			#team1Points {
                position: absolute;
                z-index: 3;
				text-align: center;
				top: 11.5%;
				left: 36.6%;
				font-size: 10px;
				color: white;
				letter-spacing: 0.15em;
			}
			#team2Points {
                position: absolute;
                z-index: 3;
				text-align: center;
				top: 11.5%;
				left: 57.8%;
				font-size: 10px;
				color: rgb(255, 255, 255);
				letter-spacing: 0.15em;
			}

            .teamName {
                font-family: 'Horizon-Bold', sans-serif;
                font-size: 20px;
				color: rgb(255, 255, 255);
            }
			#matchType {
				position: absolute;
				top: 0.3%;
                width: 100%;
                z-index: 3;
                text-align: center;
				font-family: 'Horizon-Bold', sans-serif;
				font-size: 18px;
				color: white;
			}
			#bestOf {
				position: absolute;
				width: 100%;
				top: 11.5%;
				z-index: 3;
				text-align: center;
				font-family: 'Horizon-Bold', sans-serif;
				font-size: 20px;
				color: white;
			}

			.team-bg {
				position: absolute;
				float: left;
				background-color: rgb(24, 23, 70);
				width: 60px;
				height: 60px;
				z-index: 0;
				clear: both;
				top: 0.4%;
			}

			.team-logo {
				position: absolute;
				width: 60px;
				height: 60px;
				aspect-ratio: 1 / 1;
				background-size: cover;
				background-repeat: no-repeat;
				background-position: center;
				z-index: 1;
				top: 0.4%;
			}

			#team1-bg, #team1-logo {
				left: 16.6%;
			}
			#team2-bg, #team2-logo {
				right: 16.5%;
			}

		</style>
	</head>
	<body>
		<img id="teamsOverlay" src="" alt="Background Image">
		<div id="matchType">Match Type</div>
		<div class="teamName" id="team1">Team 1</div>
		<div class="teamName" id="team2">Team 2</div>
		<!-- <div id="bestOf">Best Of</div> -->
		<!-- <div id="team1Points">
		</div>
		<div id="team2Points">
		</div> -->
		<div class="team-bg" id="team1-bg"></div>
		<div class="team-bg" id="team2-bg"></div>

		<div class="team-logo" id="team1-logo"></div>
		<div class="team-logo" id="team2-logo"></div>

		<script>
			// We get the replicants we want to listen to
			const team1 = nodecg.Replicant('team1');
			const team2 = nodecg.Replicant('team2');
			document.addEventListener('DOMContentLoaded', () => {
				// We set the background image
				const backgroundImage = document.getElementById('teamsOverlay');
				nodecg.Replicant('assets:teamsOverlay').on('change', newValue => {
					backgroundImage.src = newValue[0].url;
				});
			});
			const matchType = nodecg.Replicant('matchType');
			const bestOf = nodecg.Replicant('bestOf');

			// const team1Points = nodecg.Replicant('team1Points');
			// const team2Points = nodecg.Replicant('team2Points');

			// This here is a listener that will update the text in the div when the value of the replicant changes
			team1.on('change', (newValue, oldValue) => {
				document.getElementById('team1').innerText = newValue;
			});
			team2.on('change', (newValue, oldValue) => {
				document.getElementById('team2').innerText = newValue;
			});

			matchType.on('change', (newValue, oldValue) => {
				document.getElementById('matchType').innerText = newValue;
			});
			bestOf.on('change', (newValue, oldValue) => {
				document.getElementById('bestOf').innerText = "Best Of " + newValue;
			});

			function generateCircles(points) {
				let circles = '';
				for (let i = 0; i < points; i++) {
					circles += '<i class="fas fa-circle"></i>';
				}
				return circles;
			}

			const teamLogo1 = nodecg.Replicant('teamLogo1');
			const teamLogo2 = nodecg.Replicant('teamLogo2');

			teamLogo1.on('change', (newValue, oldValue) => {
				const logoPath = `team-logos/${newValue}`;
				document.getElementById('team1-logo').style.backgroundImage = `url(${logoPath})`;
			});
			teamLogo2.on('change', (newValue, oldValue) => {
				const logoPath = `team-logos/${newValue}`;
				document.getElementById('team2-logo').style.backgroundImage = `url(${logoPath})`;
			});

			// team1Points.on('change', (newValue, oldValue) => {
			// 	document.getElementById('team1Points').innerHTML = generateCircles(newValue);
			// });
			// team2Points.on('change', (newValue, oldValue) => {
			// 	document.getElementById('team2Points').innerHTML = generateCircles(newValue);
			// });

		</script>
	</body>
</html>
