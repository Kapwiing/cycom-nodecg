<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Player Stats</title>
		<meta charset="UTF-8" />
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<style>
            body {
                display: flex;
                justify-content: center;
                font-family: Arial, sans-serif;
            }

			#updateCast {
                padding: 20px;
                border-radius: 5px;
            }

			.cast-info {
				display: flex;
			}

			.cast1-info {
				display: flex;
				flex-direction: column;
			}

			.vert-separator {
				width: 20px;
				border-left: 4px solid;
				color: #9daecf;
			}

			#updateStatsbutton {
				background-color: #04d400;
				color: white;
				border: none;
				padding: 10px 20px;
				border-radius: 5px;
				cursor: pointer;
				margin-bottom: 20px;
			}
			#updateStatsbutton:hover {
				background-color: #018620;
			}

			#getStatsButton {
				background-color: #007BFF;
				color: white;
				border: none;
				padding: 10px 20px;
				border-radius: 5px;
				cursor: pointer;
				margin-bottom: 20px;
			}
			#getStatsButton:hover {
				background-color: #0056b3;
			}

			#clearStatsButton {
				background-color: #dc3545;
				color: white;
				border: none;
				padding: 10px 20px;
				border-radius: 5px;
				cursor: pointer;
				margin-bottom: 20px;
			}
			#clearStatsButton:hover {
				background-color: #a71d2a;
			}

			.input-field {
				display: inline-block;
				width: 90%;
			}
			.input-field input {
				width: 90%;
                padding: 10px;
                margin-bottom: 10px;
                border-radius: 5px;
                border: 1px solid #ddd;
			}
			.input-field label {
				font-weight: bold;
			}
			.update-button {
				display: block;
				text-align: center;
			}
        </style>
	</head>
	<body>
		<form id="updateCast">
			<div class="cast-info">
				<div class="cast1-info">
					<div class="input-field">
						<label for="player">Player Name</label>
						<input type="text" id="player"/>

						<label for="jsonResponse">Raw JSON Response (debugging)</label>
						<textarea id="jsonResponse" rows="10" cols="50" readonly></textarea>
				</div>
			</div>
			<div class="update-button">
				<button id="getStatsButton" type="button">Get Stats</button>
				<button id="updateStatsbutton" type="submit">Update Stats</button>
				<button id="clearStatsButton" type="button">Clear Stats</button>
			</div>
			<script>
				document.getElementById('clearStatsButton').addEventListener('click', () => {
					const playerDataRep = nodecg.Replicant('playerData');
					playerDataRep.value = {};
				});
			</script>
		</form>
		<script>
			// Code for the get stats button
			const getStatsButton = document.getElementById('getStatsButton');

			getStatsButton.addEventListener('click', () => {
				const player = document.getElementById('player').value;
				nodecg.sendMessage("testMessage", player);
			});

			const playerData = nodecg.Replicant('playerData');

			playerData.on('change', (newValue) => {
				document.getElementById('jsonResponse').value = JSON.stringify(newValue, null, 2);
			});

		</script>
	</body>
</html>
