<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Player Stats</title>
		<meta charset="UTF-8" />
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
		<style>
            body {
                display: flex;
                justify-content: center;
                font-family: Arial, sans-serif;
            }

			#updateCast {
                padding: 20px;
                border-radius: 5px;
            }

			.cast-info {
				display: flex;
			}

			.cast1-info {
				display: flex;
				flex-direction: column;
			}

			.vert-separator {
				width: 20px;
				border-left: 4px solid;
				color: #9daecf;
			}

			#updateStatsbutton {
				background-color: #04d400;
				color: white;
				border: none;
				padding: 10px 20px;
				border-radius: 5px;
				cursor: pointer;
				margin-bottom: 20px;
			}
			#updateStatsbutton:hover {
				background-color: #018620;
			}

			#getStatsButton {
				background-color: #007BFF;
				color: white;
				border: none;
				padding: 10px 20px;
				border-radius: 5px;
				cursor: pointer;
				margin-bottom: 20px;
			}
			#getStatsButton:hover {
				background-color: #0056b3;
			}

			#clearStatsButton {
				background-color: #dc3545;
				color: white;
				border: none;
				padding: 10px 20px;
				border-radius: 5px;
				cursor: pointer;
				margin-bottom: 20px;
			}
			#clearStatsButton:hover {
				background-color: #a71d2a;
			}

			.input-field {
				display: inline-block;
				width: 90%;
			}
			.input-field input {
				width: 90%;
                padding: 10px;
                margin-bottom: 10px;
                border-radius: 5px;
                border: 1px solid #ddd;
			}
			.input-field label {
				font-weight: bold;
			}
			.update-button {
				display: block;
				text-align: center;
			}

			#teamSelect, #teamPlayerSelect {
				width: 95%;
				padding: 10px;
			}

			#jsonResponse {
				width: 95%;
				margin-top: 10px;
				font-family: monospace;
			}
        </style>
	</head>
	<body>

					<div class="input-field">

								<option value="KCT">KCT</option>
								<option value="Les_Asteks">Les Asteks</option>
								<option value="Mega_Super_Team">Mega Super Team</option>
								<option value="Sussy">Sussy</option>
								<option value="Tema_sa_gueule">Tema sa gueule</option>
								<option value="Puff_Goût_Paff">Puff Goût Paff</option>
							</select>
						</div>
						<div class="input-field">
							<label for="teamPlayerSelect">Select Player</label>
							<select id="teamPlayerSelect" disabled>
								<option value="">-- Select Player --</option>
							</select>
						</div>
						<script>

							const teamSelect = document.getElementById('teamSelect');
							const teamPlayerSelect = document.getElementById('teamPlayerSelect');
							const playerInput = document.getElementById('player');

							teamSelect.addEventListener('change', function() {
								const selectedTeam = this.value;
								teamPlayerSelect.innerHTML = '<option value="">-- Select Player --</option>';
								if (teams[selectedTeam]) {
									teams[selectedTeam].forEach(player => {
										const option = document.createElement('option');
										option.value = player.tag;
										option.textContent = player.name;
										teamPlayerSelect.appendChild(option);
									});
									teamPlayerSelect.disabled = false;
								} else {
									teamPlayerSelect.disabled = true;
								}
								playerInput.value = '';
							});

							teamPlayerSelect.addEventListener('change', function() {
								playerInput.value = this.value;
							});
						</script>
						<label for="jsonResponse">Raw JSON Response (debugging)</label>
						<textarea id="jsonResponse" rows="10" cols="50" readonly></textarea>
				</div>
			</div>
			<div class="update-button">
				<button id="getStatsButton" type="button">Get Stats</button>
				<button id="updateStatsbutton" type="submit">Update Stats</button>
				<button id="clearStatsButton" type="button">Clear Stats</button>
			</div>
			<script>
				document.getElementById('clearStatsButton').addEventListener('click', () => {
					const playerDataRep = nodecg.Replicant('playerData');
					playerDataRep.value = {};
					const playerRep = nodecg.Replicant('player');
					playerRep.value = "";
				});
			</script>
		</form>
		<script>
			// Code for the get stats button
			const getStatsButton = document.getElementById('getStatsButton');

			getStatsButton.addEventListener('click', () => {
				const player = document.getElementById('player').value;
				nodecg.sendMessage("testMessage", player);
			});

			const player = nodecg.Replicant('player');
			const playerData = nodecg.Replicant('playerData');

			player.on('change', (newValue) => {
				document.getElementById('player').value = newValue || '';
			});

			playerData.on('change', (newValue) => {
				document.getElementById('jsonResponse').value = JSON.stringify(newValue, null, 2);
			});

			const updateStatsForm = document.getElementById('updateStatsbutton');

			updateStatsForm.addEventListener('click', (event) => {
				event.preventDefault();
				const playerDataRep = nodecg.Replicant('playerData');
				playerDataRep.value = document.getElementById('jsonResponse').value ? JSON.parse(document.getElementById('jsonResponse').value) : {};
			});
		</script>
	</body>
</html>
